services:
  # --- 1. Твой Бэкенд (Python) ---
  backend:
    image: backednd_kursach
    build: ./backend       # Ищем Dockerfile в папке backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=science_db
      - DB_USER=student
      - DB_PASS=pass123
    networks:
      - app-network
    # ЗАМЕТЬ: Тут НЕТ раздела ports. 
    # Мы закрыли прямой доступ к бэкенду. Доступ только внутри сети Docker.

  # --- 2. Nginx (Входные ворота) ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # Открываем стандартный порт браузера
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # Прокидываем наш конфиг внутрь
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  # --- 3. База данных (Postgres) ---
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: science_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # --- 4. Админка для базы (pgAdmin) ---
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app-network
  # ... (backend, db, pgadmin остаются как были)

  # --- 5. Твой Фронтенд ---
  frontend:
    image: front_kursach
    build: ./frontend
    restart: always
    networks:
      - app-network
    # Порты наружу не открываем! Доступ только через Главный Nginx.

volumes:
  postgres_data:

networks:
  app-network:
    driver: overlay