services:
  backend:
    image: backend_kursach
    build: ./backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=science_db
      - DB_USER=student
      - DB_PASS=pass123
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: science_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    image: front_kursach
    build: ./frontend
    restart: always
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: overlay